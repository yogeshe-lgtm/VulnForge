[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnforge"
version = "0.1.0"
description = "Professional Web Security Assessment Engine for Authorized Testing"
readme = "README.md"
authors = [{ name = "VulnForge Core Team" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tomli-w>=1.0.0",
    "beautifulsoup4>=4.12.0",
]

[tool.setuptools.packages.find]
include = ["vulnforge*"]
exclude = ["tests*", "reports*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
vulnforge = "vulnforge.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
